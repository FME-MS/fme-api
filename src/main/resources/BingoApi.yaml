openapi: 3.1.0
info:
  title: Bingo Api
  description: Bingo Api
  version: 1.0.0-SNAPSHOT
servers:
  - url: 'http://localhost:8080/api'
paths:
  /bingo/entry:
    post:
      tags: [ Bingo ]
      summary: "Create Bingo Entry"
      security:
        - bearerAuth: [ ]
      operationId: "createBingoEntry"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBingoEntryRequest"
      responses:
        201:
          description: "Created new bingo entry"
        409:
          description: "Entry already exists"
    delete:
      description: "Delete bingo entry"
      operationId: "deleteBingoEntry"
      tags: [ Bingo ]
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: uuid
      responses:
        200:
          description: "Deleted bingo entry"
    get:
      description: "Get a page of bingo entries"
      operationId: "getPagedBingoEntries"
      tags: [ Bingo ]
      security:
        - bearerAuth: [ ]
      parameters:
        - in: query
          name: pageNumber
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        200:
          description: "Page of Bingo Entries"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBingoEntriesResponse'

  /bingo/lobby:
    post:
      tags: [ Bingo ]
      summary: "Create new bingo lobby"
      security:
        - bearerAuth: [ ]
      operationId: "createBingoLobby"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBingoLobbyRequest"
      responses:
        '201':
          description: "Created new bingo lobby successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBingoLobbyResponse"
        '401':
          description: "Unauthorized"
        '409':
          description: "Already in existing game"

components:
  schemas:
    CreateBingoLobbyRequest:
      type: object
      required: [lobbyName, playerCount]
      properties:
        lobbyName:
          type: string
        maxPlayerCount:
          type: integer
    CreateBingoLobbyResponse:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        invitationCode:
          type: string
        lobbyName:
          type: string
        maxPlayerCount:
          type: integer

    BingoEntry:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        content:
          type: string

    CreateBingoEntryRequest:
      type: object
      properties:
        content:
          type: string

    PagedBingoEntriesResponse:
      type: object
      description: "Paged Bingo entries response"
      properties:
        metadata:
          $ref: "./common/schemas/schemas.yaml#/components/schemas/PagedMetadataResponse"
        content:
          type: array
          items:
            $ref: "#/components/schemas/BingoEntry"

    GetBingoBoardResponse:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        cells:
          type: array
          items:
            type: object
            properties:
              order:
                type: integer
              entry:
                type: string
              markedDone:
                type: boolean




